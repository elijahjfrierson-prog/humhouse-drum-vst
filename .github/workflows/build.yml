name: Build plugin artifacts

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write  # needed for softprops/action-gh-release to attach assets

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (VST3 + AU, universal .dmg)
            os: macos-14
            artifact: HumHouse-Drums-X-macOS
          - name: Windows (VST3)
            os: windows-2022
            artifact: HumHouse-Drums-X-Windows-x64
          - name: Linux (VST3)
            os: ubuntu-22.04
            artifact: HumHouse-Drums-X-Linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libfreetype6-dev libfontconfig1-dev \
            libgl1-mesa-dev libxrender-dev libxcomposite-dev libxext-dev

      - name: Configure (macOS, universal)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64

      # Three targets each compile the whole of JUCE; an unbounded -j runs the
      # hosted runners out of memory (cc1plus killed), so cap the job count.
      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Engine tests
        run: ctest --test-dir build -C Release --output-on-failure

      # ---------- macOS: package a drag-to-install DMG ----------
      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          DMG_OUT: HumHouse-Drums-X-macOS.dmg
        run: |
          chmod +x scripts/package_macos_dmg.sh
          ./scripts/package_macos_dmg.sh
          mkdir -p artifacts
          mv "$DMG_OUT" artifacts/

      # ---------- macOS: build the guided .pkg installer (EULA + welcome) ----------
      - name: Package .pkg installer (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_INSTALLER_ID: ${{ secrets.APPLE_INSTALLER_ID }}
          PKG_OUT: HumHouse-Drums-X-macOS.pkg
          VERSION: ${{ github.ref_name }}
        run: |
          chmod +x scripts/package_macos_pkg.sh
          ./scripts/package_macos_pkg.sh
          mv "$PKG_OUT" artifacts/

      # ---------- Windows: build .exe installer via Inno Setup ----------
      - name: Package Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # Inno Setup 6 ships preinstalled on windows-2022 GitHub runners.
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc installer/windows/HumHouseDrums.iss
          Copy-Item HumHouse-Drums-X-Windows-Setup.exe artifacts/

          # Also ship the raw VST3 + Standalone .exe for users who prefer
          # manual install or portable use.
          Copy-Item -Recurse "build/AIDrumVST_artefacts/Release/VST3/HumHouse Drums X.vst3" artifacts/
          Copy-Item "build/AIDrumVST_artefacts/Release/Standalone/HumHouse Drums X.exe" artifacts/
          @'
          HumHouse Drums X — Windows
          ==========================

          RECOMMENDED: run HumHouse-Drums-X-Windows-Setup.exe — it installs
          the VST3 into C:\Program Files\Common Files\VST3\ and the
          Standalone into Program Files automatically. After install, open
          FL Studio -> Options -> Manage Plugins -> Find installed plugins.

          MANUAL INSTALL (alternative):
          A) Standalone app (NO plugin scanning needed):
             Double-click "HumHouse Drums X.exe".
          B) VST3 plugin:
             Copy the whole "HumHouse Drums X.vst3" folder into
                 C:\Program Files\Common Files\VST3\
          '@ | Out-File -FilePath artifacts/README.txt -Encoding ASCII

      # ---------- Prove the installers actually install ----------
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = 'artifacts/HumHouse-Drums-X-Windows-Setup.exe'
          $len = (Get-Item $exe).Length
          if ($len -lt 5MB) { throw "installer is only $len bytes" }

          # Stand in for a previous version: a kit and a plug-in file that the
          # new setup has to sweep away rather than leave behind.
          $stale = "$env:ProgramData\HumHouse\Drums X\Content\Kits\OldKit"
          New-Item -ItemType Directory -Force -Path $stale | Out-Null
          Set-Content -LiteralPath "$stale\stale.flac" -Value 'old'
          $staleVst3 = "$env:CommonProgramFiles\VST3\HumHouse Drums X.vst3\Contents\stale.txt"
          New-Item -ItemType Directory -Force -Path (Split-Path $staleVst3) | Out-Null
          Set-Content -LiteralPath $staleVst3 -Value 'old'

          Start-Process -Wait -FilePath $exe `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          # Installing again must succeed as an in-place upgrade, not a second copy.
          Start-Process -Wait -FilePath $exe `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'

          foreach ($p in @("$stale\stale.flac", $staleVst3)) {
            if (Test-Path -LiteralPath $p) { throw "upgrade left the old version behind: $p" }
          }
          $kit = "$env:ProgramData\HumHouse\Drums X\Content\Kits\NakedRock\kit.json"
          if (-not (Test-Path -LiteralPath $kit)) { throw 'the shipped kit was not installed' }
          $expected = @(
            "$env:CommonProgramFiles\VST3\HumHouse Drums X.vst3",
            "$env:ProgramFiles\HumHouse\HumHouse Drums X\HumHouse Drums X.exe",
            "$env:ProgramData\HumHouse\Drums X\Content\content_manifest.json"
          )
          foreach ($p in $expected) {
            if (-not (Test-Path -LiteralPath $p)) { throw "installer did not create $p" }
            Write-Host "installed: $p"
          }
          $manifest = Get-Content -LiteralPath "$env:ProgramData\HumHouse\Drums X\Content\content_manifest.json" -Raw | ConvertFrom-Json
          if (-not $manifest.format_version) { throw 'installed content has no format_version' }
          Write-Host "installed content format_version $($manifest.format_version)"

      - name: Verify macOS installer
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          pkg="artifacts/HumHouse-Drums-X-macOS.pkg"
          pkgutil --expand "$pkg" /tmp/pkg_expanded
          test -f /tmp/pkg_expanded/Resources/license.txt \
            || { echo "no EULA pane in the installer"; exit 1; }
          for part in content.pkg vst3.pkg; do
            test -d "/tmp/pkg_expanded/$part" || { echo "missing $part"; exit 1; }
          done
          # Stand in for a previous version, then install twice: the second
          # run is the upgrade path a user actually hits.
          sudo mkdir -p "/Library/Application Support/HumHouse/Drums X/Content/Kits/OldKit"
          echo old | sudo tee "/Library/Application Support/HumHouse/Drums X/Content/Kits/OldKit/stale.flac" >/dev/null
          sudo installer -pkg "$pkg" -target /
          sudo installer -pkg "$pkg" -target /
          if [ -e "/Library/Application Support/HumHouse/Drums X/Content/Kits/OldKit/stale.flac" ]; then
            echo "upgrade left the old content behind"; exit 1
          fi
          test -f "/Library/Application Support/HumHouse/Drums X/Content/Kits/NakedRock/kit.json" \
            || { echo "the shipped kit was not installed"; exit 1; }
          for p in "/Library/Audio/Plug-Ins/VST3/HumHouse Drums X.vst3" \
                   "/Library/Application Support/HumHouse/Drums X/Content/content_manifest.json"; do
            test -e "$p" || { echo "installer did not create $p"; exit 1; }
            echo "installed: $p"
          done
          python3 -c "import json,sys; m=json.load(open('/Library/Application Support/HumHouse/Drums X/Content/content_manifest.json')); print('installed content format_version', m['format_version'])"

      # ---------- Linux: copy VST3 bundle + Standalone binary ----------
      - name: Stage artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          cp -R "build/AIDrumVST_artefacts/Release/VST3/HumHouse Drums X.vst3" artifacts/
          cp    "build/AIDrumVST_artefacts/Release/Standalone/HumHouse Drums X" artifacts/ || true
          cat > artifacts/README.txt <<'EOF'
          HumHouse Drums X — Linux

          Standalone: chmod +x "HumHouse Drums X" && ./"HumHouse Drums X"
          VST3:       copy "HumHouse Drums X.vst3" folder into ~/.vst3/
          EOF

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/
          if-no-files-found: error

      # ---------- Prepare release assets (tagged releases only) ----------
      - name: Stage release assets (Windows)
        if: github.event_name == 'release' && runner.os == 'Windows'
        shell: bash
        run: |
          # Installer ships as its own standalone .exe asset.
          cp artifacts/HumHouse-Drums-X-Windows-Setup.exe .
          # Also zip the portable VST3 + Standalone .exe for users who want manual install.
          mkdir -p _portable
          cp -R "artifacts/HumHouse Drums X.vst3" _portable/
          cp "artifacts/HumHouse Drums X.exe" _portable/
          cp artifacts/README.txt _portable/
          cd _portable && 7z a -tzip "../${{ matrix.artifact }}.zip" .

      - name: Stage release assets (Linux)
        if: github.event_name == 'release' && runner.os == 'Linux'
        shell: bash
        run: |
          cd artifacts
          zip -r "../${{ matrix.artifact }}.zip" .

      - name: Stage release assets (macOS)
        if: github.event_name == 'release' && runner.os == 'macOS'
        run: |
          cp "artifacts/HumHouse-Drums-X-macOS.dmg" .
          cp "artifacts/HumHouse-Drums-X-macOS.pkg" .

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.os == 'macOS'   && 'HumHouse-Drums-X-macOS.dmg'               || '' }}
            ${{ runner.os == 'macOS'   && 'HumHouse-Drums-X-macOS.pkg'               || '' }}
            ${{ runner.os == 'Windows' && 'HumHouse-Drums-X-Windows-Setup.exe'       || '' }}
            ${{ runner.os == 'Windows' && format('{0}.zip', matrix.artifact)       || '' }}
            ${{ runner.os == 'Linux'   && format('{0}.zip', matrix.artifact)       || '' }}
